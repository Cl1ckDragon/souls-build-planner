version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: souls_planner_db
    environment:
      POSTGRES_DB: souls_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: souls_planner_backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/souls_planner
      JWT_SECRET: change-me-in-production-must-be-at-least-256-bits-long-for-hmac-sha256
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: souls_planner_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
